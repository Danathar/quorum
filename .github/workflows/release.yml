name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "tag ${TAG} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - id: sha
        run: echo "sha256=$(cut -d' ' -f1 dist/quorum.mjs.sha256)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quorum-bundle
          path: |
            dist/quorum.mjs
            dist/quorum.mjs.sha256
          if-no-files-found: error

  smoke:
    needs: bundle
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quorum-bundle
          path: dist
      - name: Checksum matches
        run: cd dist && sha256sum -c quorum.mjs.sha256
      - run: node scripts/smoke.mjs dist/quorum.mjs
      - run: node scripts/smoke.mjs dist/quorum.mjs --with-davey

  publish:
    needs: [bundle, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: quorum-bundle
          path: dist
      - name: Create the GitHub release with quorum.mjs and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ needs.bundle.outputs.sha256 }}
        run: |
          notes="quorum ${TAG}. Single-file bundle for Node 22 on amd64 and arm64.

          sha256 (quorum.mjs): ${SHA256}

          Discord voice also needs @snazzah/davey installed next to quorum.mjs; see the README."
          gh release create "${TAG}" dist/quorum.mjs dist/quorum.mjs.sha256 \
            --repo "${GITHUB_REPOSITORY}" --title "${TAG}" --notes "${notes}" --verify-tag
