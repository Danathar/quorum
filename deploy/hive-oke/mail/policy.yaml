# Network policy for namespace `mail`.
#
# Ingress: SMTP (2525, the Service maps port 25 to it) from anywhere, since mail comes from
# the internet; health (8080) only from inside the cluster (kubelet probes are not subject
# to NetworkPolicy).
# Egress: DNS (CoreDNS in kube-system resolves SPF, DKIM and DMARC records upstream) and the
# hub Service in namespace hive-hub on port 80. Nothing else: hive-mx never sends mail.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hive-mx
  namespace: mail
  labels:
    app.kubernetes.io/name: hive-mx
    app.kubernetes.io/part-of: hive-mail
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hive-mx
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 2525
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: hive-hub
          podSelector:
            matchLabels:
              app: hive-hub
      ports:
        - port: 80
          protocol: TCP
